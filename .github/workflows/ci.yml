name: Test Extension
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'v24.19.0'
      - run: npm ci
      - name: Type check
        run: npm run check-types
      - name: Lint
        run: npm run lint
      - name: Test
        run: xvfb-run -a npm test